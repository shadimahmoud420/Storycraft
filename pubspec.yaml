name: storycraft
description: "StoryCraft – design Instagram-ready stories with Arabic & English fonts, colors, gradients and one-tap photo enhancement."
publish_to: 'none'

# version: <versionName>+<versionCode/buildNumber>
# Increase the number after + with every upload to Google Play / App Store.
version: 1.3.0+6

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  image_picker: ^1.1.2
  image: ^4.3.0
  path_provider: ^2.1.5
  share_plus: ^13.0.0
  gal: ^2.3.0
  shared_preferences: ^2.3.3
  flutter_svg: ^2.0.10

  instagram_story_share:
    path: packages/instagram_story_share
  subject_cutout:
    path: packages/subject_cutout
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  camera: ^0.12.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

