group = "com.storycraft.subject_cutout"
version = "1.0"

apply plugin: "com.android.library"

android {
    namespace = "com.storycraft.subject_cutout"
    compileSdk = 35

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    defaultConfig {
        minSdk = 24
    }
}

dependencies {
    // On-device subject segmentation, delivered through Google Play services.
    implementation("com.google.android.gms:play-services-mlkit-subject-segmentation:16.0.0-beta1")
    // Face contours for skin cleanup, also from Google Play services (the
    // model isn't packed into the app, which keeps it smaller).
    implementation("com.google.android.gms:play-services-mlkit-face-detection:17.1.0")
}
