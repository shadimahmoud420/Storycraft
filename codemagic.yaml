# Codemagic CI: builds & uploads StoryCraft without needing a Mac.
# Setup steps are in docs/RELEASE_GUIDE.md (section "بدون جهاز Mac").
workflows:
  ios-release:
    name: iOS → TestFlight / App Store
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      # Name you gave the App Store Connect API key in Codemagic settings.
      app_store_connect: StoryCraft ASC
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        # Holds CERTIFICATE_PRIVATE_KEY (see docs/RELEASE_GUIDE.md).
        - ios_signing
      vars:
        BUNDLE_ID: com.shadimahmoud.storycraft
        # App Store Connect → App → General → App Information → Apple ID
        APP_STORE_APPLE_ID: 6816655860
    scripts:
      - name: Native project setup
        script: |
          [ -d ios/Runner ] || bash tool/setup.sh
          flutter pub get
      - name: Code signing
        script: |
          # Creates (first run) or reuses the distribution certificate and
          # App Store provisioning profile through the ASC integration.
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build IPA
        script: |
          # First upload has no previous build: start from 0.
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0)
          BUILD=$((${LATEST:-0} + 1))
          flutter build ipa --release \
            --build-number=$BUILD \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  android-release:
    name: Android → Google Play (internal testing)
    max_build_duration: 45
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      # Upload keystore added in Codemagic → Team → Code signing identities.
      android_signing:
        - storycraft_upload_key
      # After the first release is uploaded by hand, add the google_play group
      # (GCLOUD_SERVICE_ACCOUNT_CREDENTIALS) and the publishing section below.
    scripts:
      - name: Native project setup
        script: |
          [ -d android/app ] && [ -f android/app/build.gradle.kts ] || bash tool/setup.sh
          flutter pub get
      - name: Signing properties
        script: |
          cat > android/key.properties <<EOF
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=$CM_KEYSTORE_PATH
          EOF
      - name: Build AAB
        script: flutter build appbundle --release --build-number=$PROJECT_BUILD_NUMBER
    artifacts:
      - build/app/outputs/bundle/release/*.aab
    # The first upload to a new Play app must be manual (download the .aab
    # from Artifacts). Then enable automatic publishing:
    # publishing:
    #   google_play:
    #     credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
    #     track: alpha
    #     submit_as_draft: true
